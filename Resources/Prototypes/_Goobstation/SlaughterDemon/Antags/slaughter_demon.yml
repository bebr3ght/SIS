- type: antag
  id: SlaughterDemon
  name: roles-antag-slaughter-demon-name
  antagonist: true
  objective: roles-antag-slaughter-demon-objective

- type: antagSpecifier
  id: SlaughterDemon
  spawnerPrototype: SpawnPointGhostSlaughterDemon
  briefing:
    # SIS-ChatGreeting Start
    # text: slaughter-role-greeting
    # color: Red
    # SIS-ChatGreeting End
    sound: /Audio/_Goobstation/SlaughterDemon/briefing.ogg
    # SIS-ChatGreeting Start
    theme:
      titleBackground: "#3a0005"
      titleBorder: "#ff0033"
      messageBackground: "#170204"
      messageBorder: "#66000e"
      titleText: "#ff3366"
      messageText: "#fca5a5"
      titleHighlight1: "#660000"
      messageHighlight1: "#660000"
      messageHighlight2: "#ff0033"
    sections:
    - title: role-greeting-title
      message: slaughter-role-greeting
    - title: role-greeting-desc
      message: slaughter-role-greeting-desc
    # SIS-ChatGreeting End
  components:
  - type: RandomMetadata
    nameSegments:
    - NamesSlaughterTitle
    - NamesSlaughter
    nameFormat: name-format-slaughter
  mindRoles: [ MindRoleSlaughterDemon ]

