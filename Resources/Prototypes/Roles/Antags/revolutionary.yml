- type: antag
  id: HeadRev
  name: roles-antag-rev-head-name
  antagonist: true
  setPreference: true
  objective: roles-antag-rev-head-objective
  guides: [ Revolutionaries ]
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 1h
  creditImage: /Textures/_Trauma/EndCredits/Antags/revolution.png # Trauma

- type: antagSpecifier
  abstract: true
  parent: RestrictedAntag
  id: BaseRev
  name: revolutionary
  prefRoles:
  - GenericTeamAntagonist # For antag ban purposes
  components:
  - type: Revolutionary

- type: antagSpecifier
  parent: BaseRev
  id: HeadRev
  prefRoles:
  - HeadRev
  briefing:
    # SIS-ChatGreeting Start
    # text: head-rev-role-greeting
    # color: CornflowerBlue
    # SIS-ChatGreeting End
    sound: "/Audio/Ambience/Antag/headrev_start.ogg"
    # SIS-ChatGreeting Start
    theme:
      titleBackground: "#1a2333"
      titleBorder: "#4169E1"
      messageBackground: "#101622"
      messageBorder: "#202e45"
      titleText: White
      messageText: "#F0F0F0"
      titleHighlight1: "#00FFFF"
      titleHighlight2: White
      messageHighlight1: "#00FFFF"
      messageHighlight2: White
    sections:
    - title: role-greeting-title
      message: head-rev-role-greeting
    - title: role-greeting-desc
      message: head-rev-role-greeting-desc
    # SIS-ChatGreeting End
  startingGear: HeadRevGear
  components:
  - type: Revolutionary
  - type: HeadRevolutionary
  mindRoles:
  - MindRoleHeadRevolutionary
  # <Trauma>
  effects:
  - !type:AddImplant
    implant: RadioImplantHeadrev
  jobBlacklist:
  - Mime # can't speak so can't convert anyone
  - NanotrasenRepresentative
  - HeadOfPersonnel
  - ChiefMedicalOfficer
  - ResearchDirector
  - ChiefEngineer
  # </Trauma>

# TODO: Make it so creating new revolutionaries uses antag prototypes! This saves a *lot* of boilerplate for conversion antags.

- type: antag
  id: Rev
  name: roles-antag-rev-name
  antagonist: true
  setPreference: false
  objective: roles-antag-rev-objective
  guides: [ Revolutionaries ]

- type: startingGear
  id: HeadRevGear
  storage:
    back:
    # <Trauma> - replaced all upstream items
    - RevGear
    - RevGear
    - RevGear
    - RevPropagandaAdvanced
    - RevPropagandaAdvanced
    - RevMace
    - Handcuffs
    - SheetPaper
    - Megaphone
    # </Trauma>
