- type: entity
  id: TidemindDevelop
  parent: BaseGameRule
  components:
  - type: StationEvent
    weight: 3 # rare
    duration: 1
    # no occurences limit so newly arriving tiders can also get it
  - type: JobAddCollectiveMindRule
    message: station-event-tidemind-message
    affected:
      - Passenger
    channel: Tidemind

- type: entity
  parent: BaseAntagGhostRoleRule
  id: DerelictCyborgSyndicateSpawn
  components:
  - type: StationEvent
    weight: 4.5 # Uncommon
    earliestStart: 30
    reoccurrenceDelay: 30
    minimumPlayers: 4
    duration: null
  - type: SpaceSpawnRule
    spawnDistance: 0
  - type: AntagSpawner
    prototype: PlayerBorgDerelictSyndicateAssaultBattery
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: DerelictCyborgSyndicate

- type: antagSpecifier
  id: DerelictCyborgSyndicate
  spawnerPrototype: SpawnPointGhostDerelictCyborgSyndicate
  # SIS-ChatGreeting Start
  briefing:
    theme:
      titleBackground: "#170a0c"
      titleBorder: "#e11d2e"
      messageBackground: "#0a0507"
      messageBorder: "#3a1419"
      titleText: "#ff8a95"
      messageText: "#e0d2d4"
      titleHighlight1: "#e11d2e"
      messageHighlight1: "#e11d2e"
      messageHighlight2: "#ffb3ba"
    sections:
    - title: role-greeting-title
      message: ghost-role-information-derelict-cyborg-syndicate-description
    - title: role-greeting-desc
      message: derelict-cyborg-role-desc
  # SIS-ChatGreeting End

- type: entity
  parent: BaseGameRule
  id: JobDistributionError
  components:
  - type: StationEvent
    startAnnouncement: station-event-job-distribution-error-announcement
    minimumPlayers: 25
    weight: 3
    duration: 1
  - type: JobDistributionErrorRule
    jobs:
    - SecurityClown
    - PartyMaker
    - CommandMaid
    - PhoneMerchant
