- type: antag
  id: Wraith
  name: roles-antag-wraith-name
  antagonist: true
  setPreference: true
  objective: roles-antag-wraith-objective
  guides: [ Wraith ]
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 10h

- type: antagSpecifier
  id: Wraith
  prefRoles: [ Wraith ]
  spawnerPrototype: SpawnPointGhostWraithRoundstart
  allowNonHumans: true
  mindRoles: [ MindRoleGhostRoleSoloAntagonist ]
  briefing:
    # text: wraith-role-greeting # SIS-ChatGreeting
    sound: /Audio/_Goobstation/Wraith/Ambience/Void_Calls.ogg
    # SIS-ChatGreeting Start
    theme:
      titleBackground: "#110817"
      titleBorder: "#6d28d9"
      messageBackground: "#06030a"
      messageBorder: "#1f0c29"
      titleText: "#a855f7"
      messageText: "#9ca3af"
      titleHighlight1: "#a855f7"
      titleHighlight2: "#e20000"
      messageHighlight1: "#a855f7"
      messageHighlight2: "#e20000"
    sections:
    - title: role-greeting-title
      message: wraith-role-greeting
    - title: role-greeting-desc
      message: wraith-role-greeting-desc
    # SIS-ChatGreeting End
  components:
  - type: RandomMetadata
    nameSegments:
    - NamesWraith
    - NamesWraithTitle
    nameFormat: name-format-wraith
  - type: Banishment
    lives: 0
    popup: wraith-banishment

- type: antagSpecifier
  parent: Wraith
  id: WraithMidround
  spawnerPrototype: SpawnPointGhostWraith

- type: antagSmite
  id: Wraith
  antag: Wraith
  rule: WraithRoundstart
  ruleComp: WraithRule
  icon:
    sprite: _Goobstation/Wraith/wraith.rsi
    state: icon
