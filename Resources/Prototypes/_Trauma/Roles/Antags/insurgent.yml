- type: antag
  id: Insurgent
  name: roles-antag-insurgent-name
  objective: roles-antag-insurgent-objective
  antagonist: true
  setPreference: false # inky # kill insurgents
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 5h
  guides: [  ] # inky # kill insurgents

- type: antagSpecifier
  id: Insurgent
  spawnerPrototype: GhostRoleSpawnerInsurgent
  startingGear: Insurgent
  unequipOldGear: true
  prefRoles: [ Insurgent ]
  mindRoles: [ MindRoleInsurgent ]
  roleLoadout: [ RoleSurvivalStandard ]
  # SIS-ChatGreeting Start
  briefing:
    theme:
      titleBackground: "#1c1108"
      titleBorder: "#e8590c"
      messageBackground: "#120a05"
      messageBorder: "#4a2a10"
      titleText: "#ffb380"
      messageText: "#efe3d5"
      titleHighlight1: "#e8590c"
      messageHighlight1: "#e8590c"
      messageHighlight2: "#ffd8a8"
    sections:
    - title: role-greeting-title
      message: insurgent-role-greeting
    - title: role-greeting-desc
      message: insurgent-role-greeting-desc
  # SIS-ChatGreeting End
  components:
  - type: RandomHumanoidAppearance
    randomizeName: true

- type: startingGear
  id: Insurgent
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorGrey
    back: ClothingBackpackSatchel
    mask: ClothingMaskGas
    head: ClothingHeadHatWelding
    ears: ClothingHeadsetGrey
    gloves: ClothingHandsGlovesColorYellowBudget
    shoes: ClothingShoesColorBlack
    pocket2: FlashlightLantern
    belt: ClothingBeltUtilityFilled
    neck: ClothingNeckBombCollarBroken

