- type: antagSpecifier
  abstract: true
  id: BaseAbductor
  unequipOldGear: true
  briefing:
    sound: /Audio/_Shitmed/Misc/abductor.ogg
    # SIS-ChatGreeting Start
    theme:
      titleBackground: "#100d1c"
      titleBorder: "#fd0098"
      messageBackground: "#07050d"
      messageBorder: "#2c1236"
      titleText: "#f472b6"
      messageText: "#c8d6e5"
      messageHighlight1: "#00ffcc"
      messageHighlight2: "#fd0098"
    sections:
    - title: role-greeting-title
      message: abductor-role-greeting
    - title: role-greeting-desc
      message: abductor-role-greeting-desc
    # SIS-ChatGreeting End
  components:
  - type: Abductor
  - type: ActionGrant
    actions:
    - ActionReturnToShip
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: Tag
    tags:
    - Abductor
    - AbductorScientist
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
  - type: RandomMetadata
    nameSegments:
    - AbductorScientistPrefix
    - AbductorNames
    nameFormat: name-format-standard

- type: antagSpecifier
  parent: BaseAbductor
  id: LoneAbductor
  spawnerPrototype: LoneAbductorSpawner
  startingGear: LoneAbductorGear
  prefRoles: [ LoneAbductorAntag, AbductorScientistAntag, AbductorAgentAntag ]
  mindRoles: [ MindRoleLoneAbductor ]
  components:
  - type: AbductorScientist
  - type: SurgeryIgnoreClothing
  - type: Sanitized
  - type: SurgerySpeedModifier
    speedModifier: 1.5
  # TODO: does this really need to be here...
  - type: GhostRole
    name: abductor-lone-ghost-role-name
    description: abductor-lone-ghost-role-desc
    rules: abductors-ghost-role-rules
    mindRoles:
    - MindRoleGhostRoleSoloAntagonist
    raffle:
      settings: default
  - type: GhostTakeoverAvailable

- type: antagSpecifier
  parent: BaseAbductor
  id: AbductorScientist
  spawnerPrototype: AbductorScientistSpawner
  startingGear: AbductorScientistGear
  prefRoles: [ AbductorScientistAntag, AbductorAgentAntag ]
  mindRoles: [ MindRoleAbductorScientist ]
  components:
  - type: AbductorScientist
  - type: SurgeryIgnoreClothing
  - type: Sanitized
  - type: SurgerySpeedModifier
    speedModifier: 1.5

- type: antagSpecifier
  parent: BaseAbductor
  id: AbductorAgent
  spawnerPrototype: AbductorAgentSpawner
  startingGear: AbductorAgentGear
  prefRoles: [ AbductorAgentAntag, AbductorScientistAntag ]
  mindRoles: [ MindRoleAbductorAgent ]
  components:
  - type: RandomMetadata
    nameSegments:
    - AbductorAgentPrefix
    - AbductorNames
  - type: AbductorScientist # Remove if you want agents to not be able to use teleporter etc solo

- type: antagSpecifier
  id: AbductorVictim
  mindRoles: [ MindRoleAbductorVictim ]
  briefing:
    sound: /Audio/_Shitmed/Misc/abducted.ogg
    theme:
      titleBackground: "#19140d"
      titleBorder: "#e67e22"
      messageBackground: "#0c0906"
      messageBorder: "#362412"
      titleText: "#facc15"
      messageText: "#ded3c2"
      messageHighlight1: "#facc15"
      messageHighlight2: "#fd0098"
    sections:
    - title: role-greeting-title
      message: abductor-victim-role-greeting
    - title: role-greeting-desc
      message: abductor-victim-role-greeting-desc
  pickPlayer: false # manually assigned
