# Hunters
  # SpacePol
- type: startingGear
  id: HunterAntagGear
  equipment:
    head: ClothingHeadHelmetSwat # maybe keep justice for shits and giggles?
    eyes: ClothingEyesGlassesSecurity
    neck: Dinkystar
    mask: ClothingHunterMaskGasSwat
    jumpsuit: ClothingUniformJumpsuitNanotrasen
    outerClothing: ClothingOuterArmourDurathread
    back: ClothingBackpackSatchelLeather
    shoes: ClothingShoesBootsJackFilled
    belt: ClothingBeltSecurityFilled
    id: HunterPDA
    pocket1: WeaponPistolMk58
    pocket2: WeaponDisabler # inky
    ears: ClothingHeadsetAltHunter
    gloves: ClothingHandsGlovesCombat
  storage:
    back:
    - BoxSurvivalSlotsSecurity
    - MagazinePistol
    - ForensicScanner
    - MedkitCombatFilled

- type: antagSpecifier
  id: FugitiveHunter
  spawnerPrototype: SpawnPointGhostRoleHunter
  startingGear: HunterAntagGear
  briefing:
    # SIS-ChatGreeting Start
    # text: hunter-role-greeting
    # color: red
    theme:
      titleBackground: "#170a0c"
      titleBorder: "#e11d2e"
      messageBackground: "#0a0a12"
      messageBorder: "#1e2a4a"
      titleText: "#ff8a95"
      messageText: "#c7d2e8"
      titleHighlight1: "#e11d2e"
      titleHighlight2: "#1e3a8a"
      messageHighlight1: "#e11d2e"
      messageHighlight2: "#3b5bdb"
    sections:
    - title: role-greeting-title
      message: hunter-role-greeting
    - title: role-greeting-desc
      message: hunter-role-greeting-desc
    # SIS-ChatGreeting End
  components:
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: AutoImplant
    implants:
    - FakeMindShieldImplant
    - DeathAcidifierImplant
  - type: RandomMetadata
  mindRoles:
  - MindRoleGhostRoleHunter

# Fugitives
  # Convict
- type: startingGear
  id: FugitiveAntagGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitPrisoner
    shoes: ClothingShoesColorBlack
    belt: ClothingBeltStorageWaistbag
    id: IDCardTide
    pocket1: CombatKnife
    pocket2: SoapSyndie
  inhand:
  - SatchelFugitive
  storage:
    belt:
    - BarberScissors
    - Telecrystal25

- type: antagSpecifier
  id: Fugitive
  spawnerPrototype: SpawnPointGhostRoleFugitive
  startingGear: FugitiveAntagGear
  briefing:
    # SIS-ChatGreeting Start
    # text: fugitive-role-greeting
    # color: red
    theme:
      titleBackground: "#1f1710"
      titleBorder: "#ff8c1a"
      messageBackground: "#120d08"
      messageBorder: "#4a3520"
      titleText: "#ffd7a8"
      messageText: "#d9d9d9"
      titleHighlight1: "#ff8c1a"
      titleHighlight2: "#8c8c8c"
      messageHighlight1: "#ff8c1a"
      messageHighlight2: "#8c8c8c"
    sections:
    - title: role-greeting-title
      message: fugitive-role-greeting
    - title: role-greeting-desc
      message: fugitive-role-greeting-desc
    # SIS-ChatGreeting End
  components:
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: AutoImplant
    implants:
    - UplinkImplant
  - type: RandomMetadata
  - type: EmitSoundOnSpawn # fell out of the ceiling
    sound: /Audio/Effects/clang.ogg
  mindRoles:
  - MindRoleGhostRoleFugitive
