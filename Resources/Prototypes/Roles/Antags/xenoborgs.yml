- type: antag
  id: MothershipCore
  name: roles-antag-mothership-core-name
  antagonist: true
  setPreference: true
  objective: roles-antag-mothership-core-objective
  requirements:
  - !type:RoleTimeRequirement
    role: JobBorg
    time: 18000  # 5 hrs
  guides: [ Xenoborgs ]

- type: antagSpecifier
  parent: RestrictedAntag
  id: MothershipCore
  prefRoles: [ MothershipCore ]
  spawnerPrototype: SpawnPointGhostRoleMothershipCore
  # SIS-ChatGreeting Start
  briefing:
    sound: /Audio/Ambience/Antag/xenoborg_start.ogg
    theme:
      titleBackground: "#0a192f"
      titleBorder: "#2563eb"
      messageBackground: "#020617"
      messageBorder: "#1e3a8a"
      titleText: "#00bfff"
      messageText: "#e0f2fe"
      titleHighlight1: "#38bdf8"
      titleHighlight2: "#0814f2"
      messageHighlight1: "#38bdf8"
      messageHighlight2: "#e0f2fe"
    sections:
    - title: role-greeting-title
      message: mothership-role-greeting
    - title: role-greeting-desc
      message: mothership-role-greeting-desc
  # SIS-ChatGreeting End

- type: antag
  id: Xenoborg
  name: roles-antag-xenoborg-name
  antagonist: true
  setPreference: true
  objective: roles-antag-xenoborg-objective
  requirements:
  - !type:RoleTimeRequirement
    role: JobBorg
    time: 18000  # 5 hrs
  guides: [ Xenoborgs ]

- type: antagSpecifier
  abstract: true
  parent: RestrictedAntag
  id: BaseXenoborg
  prefRoles: [ Xenoborg ]
  spawnerPrototype: SpawnPointGhostRoleXenoborg
  # SIS-ChatGreeting Start
  briefing:
    sound: /Audio/Ambience/Antag/xenoborg_start.ogg
    theme:
      titleBackground: "#0a192f"
      titleBorder: "#2563eb"
      messageBackground: "#020617"
      messageBorder: "#1e3a8a"
      titleText: "#00bfff"
      messageText: "#e0f2fe"
      titleHighlight1: "#38bdf8"
      titleHighlight2: "#0814f2"
      messageHighlight1: "#38bdf8"
      messageHighlight2: "#e0f2fe"
  # SIS-ChatGreeting End

- type: antagSpecifier
  parent: BaseXenoborg
  id: Xenoborg
