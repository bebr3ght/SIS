- type: antag
  id: CosmicAntagCultist
  name: roles-antag-cosmiccult-name
  antagonist: true
  setPreference: true
  objective: roles-antag-cosmiccult-description
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 2h
  guides: [ CosmicCult ]
  creditImage: /Textures/_Trauma/EndCredits/Antags/cosmiccult.png

- type: antag
  id: CosmicAntagColossus
  name: ghost-role-information-colossus-name
  antagonist: true
  objective: ghost-role-colossus-objective

- type: antagSpecifier
  parent: RestrictedAntag
  id: CosmicCultist
  jobBlacklist: [ Chaplain ]
  # SIS-ChatGreeting Start
  sound: /Audio/_DV/CosmicCult/antag_cosmic_briefing.ogg
  briefing:
    theme:
      titleBackground: "#102226"
      titleBorder: "#4cabb3"
      messageBackground: "#081214"
      messageBorder: "#1e3b40"
      titleText: "#e0f2fe"
      messageText: "#94a3b8"
      titleHighlight1: "#00f2fe"
      messageHighlight1: "#00f2fe"
      messageHighlight2: "#a855f7"
    sections:
    - title: role-greeting-title
      message: cosmiccult-role-greeting
    - title: role-greeting-desc
      message: cosmiccult-role-greeting-desc
  # SIS-ChatGreeting End
  components:
  - type: CosmicCult
  prefRoles: [ CosmicAntagCultist ]
  mindRoles: [ MindRoleCosmicCult ]

- type: antagSpecifier
  id: CosmicColossus
  spawnerPrototype: SpawnPointCosmicColossus
  briefing:
    text: ghost-role-colossus-briefing
    # color: CadetBlue # SIS-ChatGreeting
    sound: /Audio/_DV/CosmicCult/antag_cosmic_AI_briefing.ogg
    # SIS-ChatGreeting Start
    theme:
      titleBackground: "#102226"
      titleBorder: "#4cabb3"
      messageBackground: "#081214"
      messageBorder: "#1e3b40"
      titleText: "#e0f2fe"
      messageText: "#94a3b8"
      titleHighlight1: "#00f2fe"
      messageHighlight1: "#00f2fe"
      messageHighlight2: "#a855f7"
    sections:
    - title: role-greeting-title
      message: ghost-role-colossus-briefing
    # SIS-ChatGreeting End
  mindRoles: [ MindRoleCosmicColossus ]

- type: antagSmite
  id: CosmicCultist
  antag: CosmicAntagCultist
  rule: CosmicCult
  ruleComp: CosmicCultRule
  icon:
    sprite: _DV/CosmicCult/Icons/antag_icons.rsi
    state: CosmicCult
